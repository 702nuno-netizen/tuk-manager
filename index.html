<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2344">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tuk Manager">
  <meta name="robots" content="noindex">
  <title>Tuk Manager</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="boot"><p>Tuk Manager</p><p class="legal"><a href="privacy.html">Privacidade</a> · <a href="terms.html">Termos</a></p></div></div>
  <script src="config.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/format.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/google.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('/tuk-manager/sw.js', { scope: '/tuk-manager/' }).then(function (reg) {
        if (reg.active) reg.active.postMessage({ type: 'claim' });
      }).catch(function () {});
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        var c = navigator.serviceWorker.controller;
        if (c && c.scriptURL.indexOf('/tuk-manager/') === -1) {
          navigator.serviceWorker.getRegistration('/tuk-manager/').then(function (reg) {
            if (reg && reg.active) reg.active.postMessage({ type: 'claim' });
          });
        }
      });
    }
  </script>
</body>
</html>
